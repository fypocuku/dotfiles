general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/Pictures/wallpapers/wings.jpg
    blur_passes = 0
}

# затемнение
shape {
    monitor =
    size = 1920, 1080
    color = rgba(0d0a16cc)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# время
label {
    monitor =
    text = <span font_weight="800">$TIME</span>
    color = rgb(dadefc)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 230
    halign = center
    valign = center
}

# дата: 水 • 11 • 11月 • 2026
label {
    monitor =
 text = cmd[update:60000] ~/.config/hypr/date.sh
    color = rgb(dadefc)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
}

# приветствие
label {
    monitor =
    text = おかえりなさい
    color = rgb(dadefc)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -20
    halign = center
    valign = center
}

# поле пароля
input-field {
    monitor =
    size = 260, 40
    outline_thickness = 0
    rounding = 8
    inner_color = rgb(191a29)
    font_color = rgb(dadefc)
    font_family = JetBrainsMono Nerd Font Bold
    check_color = rgb(7079e0)
    fail_color = rgb(e0789a)
    placeholder_text = <i>パスワードを入力</i>
    fail_text = <i>パスワードが違います</i>
    dots_size = 0.2
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -75
    halign = center
    valign = center
}

# подсказка внизу
label {
    monitor =
    text = ctrl + alt + f2  ·  コンソール
    color = rgb(605581)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
